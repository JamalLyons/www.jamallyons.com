<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background with slightly rounded corners -->
  <rect width="100" height="100" rx="20" fill="#121212"/>

  <!-- The ">" arrow symbol -->
  <path d="M 25 30 L 45 50 L 25 70" fill="none" stroke="#66b3ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The "_" underscore cursor -->
  <line x1="55" y1="70" x2="80" y2="70" stroke="#66b3ff" stroke-width="10" stroke-linecap="round"/>
</svg>
